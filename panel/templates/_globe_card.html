<div class="card" style="margin:20px 0;overflow:hidden;">
  <div class="card-header" style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;"><h2 style="margin:0;"><i class="fas fa-earth-asia"></i> Live network</h2><span class="text-muted" style="font-size:12px;">drag to spin</span></div>
  <div class="card-body" style="padding:0;">
    <canvas id="phvmGlobe" style="width:100%;height:340px;display:block;cursor:grab;touch-action:pan-y;" aria-label="Globe showing where the host is"></canvas>
    {% if session.role == 'admin' %}
    <div id="globeNote" style="display:none;padding:12px 16px;border-top:1px solid var(--border);font-size:13px;">
      <b>Set your server location</b> to show it on the globe:
      <input class="form-control" id="gLat" placeholder="latitude (e.g. 24.86)" style="display:inline-block;width:170px;margin:0 6px;">
      <input class="form-control" id="gLon" placeholder="longitude (e.g. 67.01)" style="display:inline-block;width:170px;margin:0 6px;">
      <button class="btn btn-secondary btn-sm" type="button" onclick="(async()=>{const r=await (await fetch('/admin/globe',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':window.PHVM_CSRF||''},body:JSON.stringify({lat:document.getElementById('gLat').value,lon:document.getElementById('gLon').value})})).json();alert(r.message);if(r.success)location.reload();})()">Save</button>
    </div>
    {% endif %}
  </div>
</div>
