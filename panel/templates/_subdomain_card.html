<div class="card" style="margin-top:18px;" id="gsCard"><div class="card-header"><h2><i class="fas fa-globe" style="margin-right:8px;color:var(--accent);"></i> Your own address</h2><span id="gsState" class="text-muted" style="font-size:12px;"></span></div>
  <div class="card-body padded" id="gsBody" style="display:none;">
    <div class="muted-note" style="margin:0 0 12px;">Pick a name and reach this server at <b class="mono" id="gsExample">name.domain.com</b> instead of the IP address.</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
      <input class="form-control mono" id="gsLabel" placeholder="myserver" maxlength="30" style="max-width:200px;"><span class="mono" id="gsBase"></span>
      <button type="button" class="btn btn-primary" onclick="gsSet()">Save</button>
      <button type="button" class="btn btn-secondary" id="gsChk" style="display:none;" onclick="gsCheck()">Test</button>
      <button type="button" class="btn btn-secondary" id="gsRm" style="display:none;" onclick="gsRemove()">Remove</button></div>
    <div class="muted-note" id="gsHint" style="margin:10px 0 0;"></div>
  </div></div>
<script>
(function(){
  const VMID = {{ vm.vm_id|tojson }}, TOK = {{ csrf_token|tojson }}, g = id => document.getElementById(id);
  const post = b => fetch('/vm/' + VMID + '/subdomain', {method: 'POST', headers: {'Content-Type': 'application/json', 'X-CSRF-Token': TOK}, body: JSON.stringify(b)}).then(r => r.json());
  async function load() {
    let d; try { d = await (await fetch('/vm/' + VMID + '/subdomain')).json(); } catch (e) { return; }
    if (!d.success || !d.base || !d.ready) { g('gsCard').style.display = 'none'; return; }
    g('gsBody').style.display = ''; g('gsBase').textContent = '.' + d.base;
    const cur = d.current || ''; g('gsLabel').value = cur ? cur.slice(0, cur.length - d.base.length - 1) : '';
    g('gsRm').style.display = cur ? '' : 'none'; g('gsChk').style.display = cur ? '' : 'none'; g('gsState').textContent = cur; g('gsExample').textContent = cur || ('name.' + d.base);
    const bits = []; if (cur && d.ssh_port) bits.push('SSH: ssh root@' + cur + ' -p ' + d.ssh_port);
    (d.ports || []).forEach(p => bits.push((p.label || ('port ' + p.guest)) + ': ' + (cur || 'name.' + d.base) + ':' + p.host));
    g('gsHint').textContent = bits.join('  ·  ');
  }
  window.gsSet = async () => { const label = g('gsLabel').value.trim(); if (!label) return; const d = await post({label}); alert(d.message); load(); };
  window.gsCheck = async () => { g('gsChk').textContent = '…'; try { const d = await (await fetch('/vm/' + VMID + '/subdomain/check')).json(); alert(d.message || 'Done'); } catch (e) { alert('Could not test right now.'); } g('gsChk').textContent = 'Test'; };
  window.gsRemove = async () => { if (!confirm('Remove this subdomain?')) return; const d = await post({action: 'remove'}); alert(d.message); load(); };
  load();
})();
</script>
