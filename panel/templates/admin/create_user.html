{% extends "base.html" %}
{% block title %}Add User — {{ site_name }}{% endblock %}
{% block breadcrumb %}
<span>PHvm</span> <span class="sep">›</span>
<a href="{{ url_for('admin_users') }}">Users</a>
<span class="sep">›</span> <span class="current">Add</span>
{% endblock %}
{% block content %}
<div class="page-header">
    <h1><i class="fas fa-user-plus"></i> Add User</h1>
</div>
<div class="card form-card" style="max-width:520px;">
    <div class="card-body form-pad">
        <form method="POST">
<input type="hidden" name="_csrf" value="{{ csrf_token }}">
            <div class="form-group">
                <label>Username *</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Email *</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Password *</label>
                <input type="password" name="password" class="form-control" required minlength="4">
            </div>
            <div class="form-group">
                <label>Role</label>
                <select name="role" class="form-control">
                    <option value="user">User</option>
                    <option value="reseller" {% if user is defined and user.role == 'reseller' %}selected{% endif %}>Reseller</option>
                    <option value="admin">Admin</option>
                </select>
                <div class="form-hint">Users cannot create VMs — only admins can.</div>
            </div>
            <button type="submit" class="btn btn-primary"><i class="fas fa-plus"></i> Create User</button>
            <a href="{{ url_for('admin_users') }}" class="btn btn-secondary" style="margin-left:8px;">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
