<script>
/* ───── Minecraft tools ───── */
const el = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function mcGet(p) { return (await fetch(`/vm/${VM}/server/mc/${p}`)).json(); }
async function mcPost(p, body, method) { return (await fetch(`/vm/${VM}/server/mc/${p}`, {method: method || 'POST', headers: H, body: JSON.stringify(body || {})})).json(); }
const fmtSize = b => b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB';
let MC = {version: '', software: 'paper'}, loaded = {};

function showTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  document.querySelectorAll('.pane').forEach(p => p.classList.toggle('active', p.id === 'pane-' + name));
  if (!loaded[name]) { loaded[name] = true; ({files: filesOpen, plugins: plInit, version: verInit, look: lookInit, settings: setInit, backups: bkInit, players: () => plyInit(), schedule: () => schInit(), connection: () => connInit()}[name] || (() => {}))(); }
}
async function mcInfo() { const d = await mcGet('info'); if (d.success) { MC = d; } return d; }

/* Plugins */
async function plInit() {
  await mcInfo();
  el('plVer').textContent = MC.version ? `Showing plugins compatible with Minecraft ${MC.version}.` : 'Start the server once so the version can be detected — until then results aren\'t filtered.';
  plSearch(); plInstalled();
}
async function plSearch() {
  el('plResults').innerHTML = '<div class="muted-note">Searching…</div>';
  const d = await mcGet('plugins/search?q=' + encodeURIComponent(el('plQ').value) + '&mcv=' + encodeURIComponent(MC.version || ''));
  if (!d.success) { el('plResults').innerHTML = `<div class="muted-note">${esc(d.message)}</div>`; return; }
  el('plResults').innerHTML = d.results.length ? d.results.map(r => `
    <div class="row-item">${r.icon ? `<img src="${esc(r.icon)}" alt="" loading="lazy">` : '<div class="ph"></div>'}
      <div class="grow"><b>${esc(r.title)}</b><small>${esc(r.description)}</small><small>by ${esc(r.author)} · ${Number(r.downloads || 0).toLocaleString()} downloads</small></div>
      <button class="btn btn-primary btn-sm" onclick="plInstall('${esc(r.slug)}', this)"><i class="fas fa-download"></i> Install</button></div>`).join('')
    : '<div class="muted-note">No results.</div>';
}
async function plInstall(slug, btn) {
  btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
  const d = await mcPost('plugins/install', {slug});
  btn.disabled = false; btn.innerHTML = '<i class="fas fa-download"></i> Install';
  alert(d.message || (d.success ? 'Installed' : 'Failed')); if (d.success) plInstalled();
}
async function plInstalled() {
  const d = await mcGet('plugins');
  if (!d.success) { el('plInstalled').textContent = d.message; return; }
  el('plInstalled').innerHTML = d.plugins.length ? d.plugins.map(p => `
    <div class="row-item"><div class="ph" style="display:flex;align-items:center;justify-content:center;"><i class="fas fa-puzzle-piece"></i></div>
      <div class="grow"><b>${esc(p.file.replace(/\.disabled$/, ''))}</b><small>${fmtSize(p.size)} · ${p.enabled ? 'Enabled' : 'Disabled'}</small></div>
      <button class="btn btn-secondary btn-sm" onclick="plManage('${esc(p.file)}','toggle')">${p.enabled ? 'Disable' : 'Enable'}</button>
      <button class="btn btn-danger btn-sm" onclick="if(confirm('Delete this plugin?'))plManage('${esc(p.file)}','delete')"><i class="fas fa-trash"></i></button></div>`).join('')
    : '<div class="muted-note">No plugins installed. Search above to add some.</div>';
}
async function plManage(file, action) { const d = await mcPost('plugins/manage', {file, action}); if (!d.success) alert(d.message); plInstalled(); }

/* Version changer */
async function verInit() {
  await mcInfo(); el('verSw').value = MC.software || 'paper';
  el('verNow').textContent = `Current: ${MC.software || 'paper'} ${MC.version || '(unknown — start the server once)'}`;
  verLoad();
}
async function verLoad() {
  el('verSel').innerHTML = '<option>Loading…</option>';
  const d = await mcGet('versions?software=' + el('verSw').value);
  el('verSel').innerHTML = d.success ? d.versions.map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join('') : `<option>${esc(d.message)}</option>`;
  if (d.success && MC.version && d.versions.includes(MC.version)) el('verSel').value = MC.version;
}
async function verApply() {
  const sw = el('verSw').value, ver = el('verSel').value;
  if (!confirm(`Change to ${sw} ${ver}? The server will stop and restart.`)) return;
  const d = await mcPost('change-version', {software: sw, version: ver, backup: el('verBackup').checked});
  alert(d.message); if (d.success) { showTab('console'); loaded.version = false; }
}

/* MOTD */
const MCCOL = {'0':'#000000','1':'#0000AA','2':'#00AA00','3':'#00AAAA','4':'#AA0000','5':'#AA00AA','6':'#FFAA00','7':'#AAAAAA','8':'#555555','9':'#5555FF','a':'#55FF55','b':'#55FFFF','c':'#FF5555','d':'#FF55FF','e':'#FFFF55','f':'#FFFFFF'};
let motdFocus = null;
function mcRender(text) {
  let out = '', st = {c: '#AAAAAA', b: 0, i: 0, u: 0, s: 0, k: 0}, buf = '';
  const flush = () => { if (!buf) return; const d = [st.u ? 'underline' : '', st.s ? 'line-through' : ''].filter(Boolean).join(' ');
    out += `<span style="color:${st.c};${st.b ? 'font-weight:700;' : ''}${st.i ? 'font-style:italic;' : ''}${d ? 'text-decoration:' + d + ';' : ''}${st.k ? 'filter:blur(1.5px);' : ''}">${esc(buf)}</span>`; buf = ''; };
  for (let i = 0; i < text.length; i++) {
    if (text[i] === '&') {
      const hex = /^&#([0-9a-fA-F]{6})/.exec(text.slice(i));
      if (hex) { flush(); st = {c: '#' + hex[1], b: 0, i: 0, u: 0, s: 0, k: 0}; i += 7; continue; }
      const k = (text[i + 1] || '').toLowerCase();
      if (MCCOL[k]) { flush(); st = {c: MCCOL[k], b: 0, i: 0, u: 0, s: 0, k: 0}; i++; continue; }
      if ('lonmk'.includes(k) && k) { flush(); st[{l:'b',o:'i',n:'u',m:'s',k:'k'}[k]] = 1; i++; continue; }
      if (k === 'r') { flush(); st = {c: '#AAAAAA', b: 0, i: 0, u: 0, s: 0, k: 0}; i++; continue; }
    }
    if (text[i] === '\n') { flush(); out += '<br>'; continue; }
    buf += text[i];
  }
  flush(); return out;
}
function motdText() { const a = el('motd1').value, b = el('motd2').value; return a + (b ? '\n' + b : ''); }
function motdRender() { el('motdPrev').innerHTML = mcRender(motdText()) || '<span style="color:#777">A Minecraft Server</span>'; }
function motdIns(code) {
  const inp = motdFocus || el('motd1'); const s = inp.selectionStart ?? inp.value.length, e = inp.selectionEnd ?? s;
  inp.value = inp.value.slice(0, s) + code + inp.value.slice(e); inp.focus(); inp.selectionStart = inp.selectionEnd = s + code.length; motdRender();
}
function gradIns() {
  const t = el('gText').value; if (!t) return; const a = el('gA').value, b = el('gB').value;
  const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)); const A = p(a), B = p(b); let r = '';
  for (let i = 0; i < t.length; i++) { const f = t.length === 1 ? 0 : i / (t.length - 1);
    r += '&#' + A.map((x, j) => Math.round(x + (B[j] - x) * f).toString(16).padStart(2, '0')).join('') + t[i]; }
  motdIns(r);
}
function motdToProp(text) {
  text = text.replace(/&#([0-9a-fA-F]{6})/g, (_, h) => '\u00A7x' + h.split('').map(c => '\u00A7' + c).join(''))
             .replace(/&([0-9a-fk-orA-FK-OR])/g, '\u00A7$1');
  let o = '';
  for (const ch of text) { const c = ch.codePointAt(0);
    if (ch === '\n') o += '\\n'; else if (ch === '\\') o += '\\\\';
    else if (c < 32) continue; else if (c > 126) o += c > 0xFFFF ? '' : '\\u' + c.toString(16).toUpperCase().padStart(4, '0'); else o += ch; }
  return o;
}
function propToMotd(raw) {
  let t = (raw || '').replace(/\\u([0-9a-fA-F]{4})/g, (_, h) => String.fromCharCode(parseInt(h, 16))).replace(/\\n/g, '\n').replace(/\\\\/g, '\\');
  t = t.replace(/\u00A7x((?:\u00A7[0-9a-fA-F]){6})/g, (_, m) => '&#' + m.replace(/\u00A7/g, ''));
  return t.replace(/\u00A7([0-9a-fk-orA-FK-OR])/g, '&$1');
}
async function lookInit() {
  el('swatches').innerHTML = Object.entries(MCCOL).map(([k, c]) => `<div class="sw" style="background:${c}" title="&${k}" onclick="motdIns('&${k}')"></div>`).join('');
  el('iconCur').src = `/vm/${VM}/server/mc/icon?t=${Date.now()}`;
  const d = await mcGet('properties');
  if (d.success) { const parts = propToMotd(d.props.motd).split('\n'); el('motd1').value = parts[0] || ''; el('motd2').value = parts[1] || ''; }
  motdRender();
}
async function motdSave(restart) {
  const d = await mcPost('properties', {changes: {motd: motdToProp(motdText())}});
  alert(d.message); if (d.success && restart) power('restart');
}

/* Icon */
let iconPng = null;
function iconPick(file) {
  if (!file) return; const img = new Image(), url = URL.createObjectURL(file);
  img.onload = () => { const c = el('iconCanvas'), x = c.getContext('2d'), s = Math.min(img.width, img.height);
    x.clearRect(0, 0, 64, 64); x.imageSmoothingQuality = 'high';
    x.drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 64, 64);
    iconPng = c.toDataURL('image/png'); el('iconApply').disabled = false; URL.revokeObjectURL(url); };
  img.onerror = () => alert('Could not read that image.'); img.src = url;
}
async function iconApply() { const d = await mcPost('icon', {png: iconPng}); alert(d.message); if (d.success) el('iconCur').src = `/vm/${VM}/server/mc/icon?t=${Date.now()}`; }
async function iconRemove() { if (!confirm('Remove the server icon?')) return; const d = await mcPost('icon', {}, 'DELETE'); alert(d.message); el('iconCur').style.visibility = 'hidden'; }

/* Settings */
const SET = [
  {k: 'gamemode', l: 'Default game mode', t: 'sel', o: ['survival', 'creative', 'adventure', 'spectator']},
  {k: 'difficulty', l: 'Difficulty', t: 'sel', o: ['peaceful', 'easy', 'normal', 'hard']},
  {k: 'max-players', l: 'Max players', t: 'num', min: 1, max: 1000},
  {k: 'view-distance', l: 'View distance', t: 'num', min: 2, max: 32},
  {k: 'simulation-distance', l: 'Simulation distance', t: 'num', min: 3, max: 32},
  {k: 'spawn-protection', l: 'Spawn protection (blocks)', t: 'num', min: 0, max: 1000},
  {k: 'pvp', l: 'PvP', t: 'bool'}, {k: 'hardcore', l: 'Hardcore', t: 'bool'}, {k: 'allow-flight', l: 'Allow flight', t: 'bool'},
  {k: 'allow-nether', l: 'Nether enabled', t: 'bool'}, {k: 'enable-command-block', l: 'Command blocks', t: 'bool'},
  {k: 'white-list', l: 'Whitelist', t: 'bool'}, {k: 'force-gamemode', l: 'Force game mode', t: 'bool'},
  {k: 'spawn-monsters', l: 'Spawn monsters', t: 'bool'}, {k: 'spawn-animals', l: 'Spawn animals', t: 'bool'}, {k: 'spawn-npcs', l: 'Spawn villagers', t: 'bool'},
  {k: 'online-mode', l: 'Online mode (premium accounts only)', t: 'bool', h: 'Use the Cracked players switch above to change this; editing it here may be reverted on restart.'},
  {k: 'level-seed', l: 'World seed (new worlds only)', t: 'txt'},
];
let setOrig = {};
let crackedOn = null;
async function crackedLoad() {
  try {
    const d = await (await fetch(`/vm/${VM}/server/mc/cracked`)).json();
    if (!d.success) { el('crackedBox').style.display = 'none'; return; }
    crackedOn = d.cracked;
    el('crackedState').textContent = d.cracked ? 'ON — cracked launchers can join' : 'OFF — premium accounts only';
    el('crackedBtn').textContent = d.cracked ? 'Require premium accounts' : 'Allow cracked players';
    el('crackedBtn').disabled = false;
  } catch (e) { el('crackedBox').style.display = 'none'; }
}
async function crackedToggle() {
  if (!confirm((crackedOn ? 'Turn cracked players OFF' : 'Allow cracked players') + '? The server restarts.')) return;
  el('crackedBtn').disabled = true;
  const d = await mcPost('cracked', {enabled: !crackedOn}); alert(d.message);
  setTimeout(crackedLoad, 90000);
}
async function setInit() {
  crackedLoad();
  const d = await mcGet('properties');
  if (!d.success || !d.exists) { el('setGrid').textContent = d.message || 'server.properties does not exist yet — start the server once.'; return; }
  setOrig = d.props;
  el('setGrid').innerHTML = SET.map(f => { const v = d.props[f.k] ?? ''; let inp;
    if (f.t === 'sel') inp = `<select class="form-control" data-k="${f.k}">${f.o.map(o => `<option ${o === v ? 'selected' : ''}>${o}</option>`).join('')}</select>`;
    else if (f.t === 'bool') inp = `<select class="form-control" data-k="${f.k}"><option ${v === 'true' ? 'selected' : ''}>true</option><option ${v === 'false' ? 'selected' : ''}>false</option></select>`;
    else if (f.t === 'num') inp = `<input class="form-control" type="number" min="${f.min}" max="${f.max}" data-k="${f.k}" value="${esc(v)}">`;
    else inp = `<input class="form-control" data-k="${f.k}" value="${esc(v)}" maxlength="100">`;
    return `<div class="form-group" style="margin:0;"><label>${f.l}</label>${inp}${f.h ? `<div class="muted-note">${f.h}</div>` : ''}</div>`; }).join('');
}
async function setSave(restart) {
  const ch = {}; document.querySelectorAll('#setGrid [data-k]').forEach(el => { if (el.value !== (setOrig[el.dataset.k] ?? '')) ch[el.dataset.k] = el.value; });
  if (!Object.keys(ch).length) { alert('Nothing changed.'); return; }
  const d = await mcPost('properties', {changes: ch}); alert(d.message);
  if (d.success) { Object.assign(setOrig, ch); if (restart) power('restart'); }
}

/* Backups */
async function bkInit() { bkList(); }
async function bkList() {
  const d = await mcGet('backups');
  if (!d.success) { el('bkList').textContent = d.message; return; }
  el('bkFree').textContent = d.free_mb != null ? `Free disk space: ${d.free_mb >= 1024 ? (d.free_mb / 1024).toFixed(1) + ' GB' : d.free_mb + ' MB'}` : '';
  el('bkList').innerHTML = d.backups.length ? d.backups.map(b => `
    <div class="row-item"><div class="ph" style="display:flex;align-items:center;justify-content:center;"><i class="fas fa-box-archive"></i></div>
      <div class="grow"><b>${esc(b.file)}</b><small>${fmtSize(b.size)} · ${new Date(b.time * 1000).toLocaleString()}</small></div>
      ${IS_DOCKER ? `<a class="btn btn-secondary btn-sm" href="/vm/${VM}/server/mc/backups/download?file=${encodeURIComponent(b.file)}" title="Download"><i class="fas fa-download"></i></a>` : ''}
      <button class="btn btn-secondary btn-sm" onclick="bkAct('restore','${esc(b.file)}')">Restore</button>
      <button class="btn btn-danger btn-sm" onclick="bkAct('delete','${esc(b.file)}')"><i class="fas fa-trash"></i></button></div>`).join('')
    : '<div class="muted-note">No backups yet.</div>';
}
async function bkCreate() { const d = await mcPost('backups/create'); alert(d.message); if (d.success) { showTab('console'); } }
async function bkAct(a, file) {
  if (a === 'restore' && !confirm('Restore this backup? The current world will be REPLACED and the server restarted.')) return;
  if (a === 'delete' && !confirm('Delete this backup?')) return;
  const d = await mcPost('backups/' + a, {file}); if (!d.success) alert(d.message); else if (a === 'restore') { alert(d.message); showTab('console'); }
  bkList();
}
</script>
<script>
/* Players */
const plyInit = () => plyLoad();
async function plyLoad() {
  const d = await mcGet('players');
  if (!d.success) { el('plyOnline').textContent = d.message; return; }
  const o = d.online;
  el('plyOnline').innerHTML = `<b>Online${o.max != null ? ` (${o.count}/${o.max})` : ''}</b> ` + (o.names.length
    ? o.names.map(n => `<span class="type-chip" style="margin:3px;">${esc(n)} <a href="#" onclick="plyDo('kick','${esc(n)}');return false;" title="Kick" style="color:inherit;"><i class="fas fa-xmark"></i></a></span>`).join('')
    : '<span class="muted-note">Nobody online (or the server is offline).</span>');
  const list = (arr, rm, label) => arr.length ? arr.map(p => `<div class="row-item"><div class="grow"><b>${esc(p.name)}</b>${label && p[label] ? `<small>${esc(p[label])}</small>` : ''}</div>
      <button class="btn btn-secondary btn-sm" onclick="plyDo('${rm}','${esc(p.name)}')">Remove</button></div>`).join('') : '<div class="muted-note">Empty.</div>';
  el('plyWl').innerHTML = list(d.whitelist, 'whitelist-remove');
  el('plyOps').innerHTML = list(d.ops, 'deop');
  el('plyBans').innerHTML = list(d.bans, 'pardon', 'reason');
}
async function plyDo(action, name, reason) {
  const d = await mcPost('players/action', {action, name, reason});
  if (!d.success) alert(d.message); setTimeout(plyLoad, 700);
}
function plyAct(action) {
  const n = el('plyName').value.trim(); if (!n) return;
  let reason = ''; if (action === 'ban') { reason = prompt('Reason (optional):') || ''; }
  plyDo(action, n, reason); el('plyName').value = '';
}
/* Schedule */
async function schInit() {
  el('schBackup').innerHTML = '<option value="-1">Off</option>' + Array.from({length: 24}, (_, h) => `<option value="${h}">Daily at ${String(h).padStart(2, '0')}:30</option>`).join('');
  const d = await mcGet('schedule');
  if (d.success) { el('schRestart').value = String(d.config.restart_hours); el('schBackup').value = String(d.config.backup_hour); el('schKeep').value = d.config.keep; }
}
async function schSave() {
  const d = await mcPost('schedule', {restart_hours: +el('schRestart').value, backup_hour: +el('schBackup').value, keep: +el('schKeep').value});
  alert(d.message);
}
</script>
<script>
/* Connection (Docker servers) */
async function connInit() {
  const d = await mcGet('connection');
  if (!d.success) { el('connNote').textContent = d.message; return; }
  el('connAddr').textContent = d.address || '—'; el('connNote').textContent = d.note || '';
  el('connDirect').textContent = d.direct || 'Set "Server IP" in admin settings';
  el('mkState').textContent = d.minekube ? 'Enabled' : 'Off'; el('mkBtn').textContent = d.minekube ? 'Disable' : 'Enable';
  el('mkBtn').className = 'btn ' + (d.minekube ? 'btn-secondary' : 'btn-primary'); el('mkBtn').dataset.on = d.minekube ? '1' : '';
  const sd = d.subdomain || {}; el('subBase').textContent = sd.base ? '.' + sd.base : '';
  const sOn = !!(sd.base && sd.ready); el('subForm').style.display = sOn ? 'flex' : 'none'; el('subOff').style.display = sOn ? 'none' : '';
  const sl = sd.current ? sd.current.slice(0, sd.current.length - sd.base.length - 1) : ''; el('subLabel').value = sl;
  el('subRm').style.display = sd.current ? '' : 'none'; el('subChk').style.display = sd.current ? '' : 'none'; el('subState').textContent = sd.current || '';
  el('subPage').style.display = sd.current ? '' : 'none'; if (sd.current) { const u = location.origin + '/mc/' + sd.current; el('subPageLink').href = u; el('subPageLink').textContent = u; }
  el('subExample').textContent = sd.current || ('name' + (sd.base ? '.' + sd.base : '.domain.com'));
  const pc = d.playit.configured;
  el('plState').textContent = pc ? (d.playit.running ? 'Agent running' : 'Agent not running (starts with the server)') : 'Off';
  el('plSetKey').style.display = pc ? 'none' : ''; el('plManage').style.display = pc ? '' : 'none'; el('plAddr').value = d.playit.address || '';
  const cl = d.playit.claim || ''; el('plClaim').style.display = cl ? '' : 'none';
  if (cl) { const a = el('plClaimLink'); a.href = cl; a.textContent = cl; }
  clearTimeout(window._plT); window._plN = cl ? 0 : (window._plN || 0); if (pc && !d.playit.address && d.playit.running && !cl && window._plN++ < 8) window._plT = setTimeout(connInit, 6000);
}
function connCopy() {
  const a = el('connAddr').textContent; if (!a || a === '—' || a === '…') return;
  navigator.clipboard.writeText(a).then(() => { const i = el('connIcon'); i.className = 'fas fa-check'; setTimeout(() => i.className = 'fas fa-copy', 1200); });
}
async function connMinekube() {
  const on = !!el('mkBtn').dataset.on;
  if (!confirm((on ? 'Disable' : 'Enable') + ' Minekube Connect? The server will restart.')) return;
  const d = await mcPost('connection', {action: on ? 'minekube-disable' : 'minekube-enable'}); alert(d.message);
  if (d.success) { showTab('console'); loaded.connection = false; }
}
async function connPlayitSet() {
  const key = el('plKey').value.trim(); if (!key) return;
  const d = await mcPost('connection', {action: 'playit-set', key}); alert(d.message);
  if (d.success) { el('plKey').value = ''; loaded.connection = false; showTab('console'); }
}
async function connDiag() {
  const o = el('diagOut'); o.textContent = 'Checking…';
  const d = await mcGet('diagnose');
  if (!d.success) { o.textContent = d.message; return; }
  const ic = {ok: 'fa-check-circle', warn: 'fa-exclamation-triangle', bad: 'fa-times-circle', info: 'fa-info-circle'};
  const col = {ok: 'var(--success)', warn: 'var(--warning)', bad: 'var(--danger)', info: 'var(--accent)'};
  o.innerHTML = '';
  d.checks.forEach(c => { const r = document.createElement('div'); r.style.cssText = 'padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;';
    const i = document.createElement('i'); i.className = 'fas ' + ic[c.level]; i.style.color = col[c.level]; i.style.marginRight = '8px';
    const b = document.createElement('b'); b.textContent = c.title; r.append(i, b);
    if (c.fix) { const f = document.createElement('div'); f.className = 'text-muted'; f.style.marginLeft = '24px'; f.textContent = c.fix; r.append(f); }
    o.append(r); });
  el('viaBtn').style.display = d.via_ok ? '' : 'none';
}
async function connVia() {
  if (!confirm('Install ViaVersion + ViaBackwards and restart the server?')) return;
  const d = await mcPost('via', {}); alert(d.message); if (d.success) setTimeout(connDiag, 4000);
}
async function connPlayitStart() {
  const d = await mcPost('connection', {action: 'playit-start'}); alert(d.message);

<script>
/* Modpack, world import, backup download, alerts, bedrock, SRV */
async function mpInstall() {
  const slug = el('mpSlug').value.trim(); if (!slug) return;
  if (!confirm('Install modpack "' + slug + '"? Your world is backed up first and the server restarts.')) return;
  const d = await mcPost('modpack', {slug}); alert(d.message); if (d.success) showTab('console');
}
async function worldImport() {
  const f = el('worldZip').files[0]; if (!f) { alert('Choose a .zip first.'); return; }
  if (!confirm('Replace the current world with this upload? (It is backed up first.)')) return;
  const fd = new FormData(); fd.append('world', f);
  const r = await fetch(`/vm/${VM}/server/mc/world/import`, {method: 'POST', headers: {'X-CSRF-Token': CSRF}, body: fd});
  const d = await r.json(); alert(d.message); if (d.success) showTab('console');
}
async function alInit() {
  const d = await (await fetch(`/vm/${VM}/server/alerts`)).json();
  if (d.success) { el('alState').textContent = d.enabled ? 'On (' + d.masked + ')' : 'Off'; }
}
async function alSave() {
  const d = await (await fetch(`/vm/${VM}/server/alerts`, {method: 'POST', headers: H, body: JSON.stringify({webhook: el('alHook').value.trim()})})).json();
  alert(d.message); if (d.success) { el('alHook').value = ''; alInit(); }
}
async function alTest() {
  const d = await (await fetch(`/vm/${VM}/server/alerts`, {method: 'POST', headers: H, body: JSON.stringify({test: true})})).json(); alert(d.message);
}
let bdOn = false;
async function bdLoad(d) {
  bdOn = d.enabled; el('bdState').textContent = d.enabled ? 'Enabled' : 'Off';
  el('bdBtn').textContent = d.enabled ? 'Disable' : 'Enable'; el('bdBtn').className = 'btn ' + (d.enabled ? 'btn-secondary' : 'btn-primary');
  el('bdAddrRow').style.display = d.enabled && d.address ? '' : 'none'; el('bdAddr').textContent = d.address || '';
  el('bdAuth').style.display = d.enabled ? '' : 'none';
}
async function bdToggle() {
  if (!confirm((bdOn ? 'Disable' : 'Enable') + ' Bedrock cross-play? The server will restart.')) return;
  const d = await mcPost('bedrock', {action: bdOn ? 'disable' : 'enable'}); alert(d.message); if (d.success) { showTab('console'); loaded.connection = false; }
}
async function bdAuth() { const d = await mcPost('bedrock', {action: 'floodgate-auth'}); alert(d.message); }
function srvRender(direct) {
  const m = /^(.+?)(?::(\d+))?$/.exec(direct || ''); const host = m ? m[1] : 'YOUR-HOST-IP', port = m && m[2] ? m[2] : '25565';
  el('srvRecords').textContent = `A     mc.yourdomain.com          ${host}\nSRV   _minecraft._tcp.play      0 5 ${port} mc.yourdomain.com.\n      (name: _minecraft._tcp.play.yourdomain.com → players join with play.yourdomain.com)`;
}
const _connInit0 = connInit;
connInit = async function () {
  await _connInit0();
  const d = await mcGet('connection'); if (d.success) { bdLoad(d.bedrock); srvRender(d.direct); }
};
const _schInit0 = schInit;
schInit = async function () { await _schInit0(); if (el('alState')) alInit(); };
</script>
