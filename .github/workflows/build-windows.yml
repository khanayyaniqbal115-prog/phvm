name: Build Windows exe

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Phoenix-Launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps
      - run: magick phoenix.ico -resize 256x256 phoenix.ico
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: Phoenix-Launcher-Windows
          path: Phoenix-Launcher/release/*.exe
