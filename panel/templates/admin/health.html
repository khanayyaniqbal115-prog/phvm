{% extends "base.html" %}
{% block title %}Panel health — {{ site_name }}{% endblock %}
{% block breadcrumb %}<span>PHvm</span> <span class="sep">›</span> <span class="current">Panel health</span>{% endblock %}
{% block content %}
<div class="page-header"><h1><i class="fas fa-heart-pulse"></i> Panel health</h1><p>Live state of this host. Updates every 5 seconds.</p></div>
<div id="hw">{% for w in h.warnings %}<div class="card" style="margin-bottom:10px;"><div class="card-body">⚠️ {{ w }}</div></div>{% endfor %}</div>
<div id="hg" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;"></div>
<script>
var T = [['CPU', function(h){return h.cpu+'%'}, function(h){return h.cpu}, function(h){return 'Load '+h.load.join(' / ')+' · '+h.cores+' cores'}],
 ['RAM', function(h){return h.ram.pct+'%'}, function(h){return h.ram.pct}, function(h){return h.ram.used+' / '+h.ram.total+' MB'}],
 ['Disk', function(h){return h.disk.pct+'%'}, function(h){return h.disk.pct}, function(h){return h.disk.used+' / '+h.disk.total+' GB'}],
 ['Swap', function(h){return h.swap.used+' MB'}, function(h){return h.swap.total?h.swap.used*100/h.swap.total:0}, function(h){return 'of '+h.swap.total+' MB'}],
 ['Docker', function(h){return h.docker.up?h.docker.running+' running':'down'}, function(h){return 0}, function(h){return h.docker.total+' containers total'}],
 ['Host', function(h){return h.servers+' servers'}, function(h){return 0}, function(h){return h.users+' users · up '+h.uptime_h+' h · DB '+h.db_mb+' MB · '+h.panel_threads+' threads'}]];
function draw(h){var g=document.getElementById('hg');g.innerHTML='';T.forEach(function(t){var c=document.createElement('div');c.className='card';var b=document.createElement('div');b.className='card-body';
 var a=document.createElement('div');a.className='text-muted';a.style.fontSize='12px';a.textContent=t[0];var n=document.createElement('div');n.style.cssText='font-size:24px;font-weight:700;';n.textContent=t[1](h);
 var p=document.createElement('div');p.style.cssText='height:6px;border-radius:5px;background:var(--border);margin:8px 0;overflow:hidden;';var q=document.createElement('div');q.style.cssText='height:100%;background:var(--accent);width:'+Math.min(100,t[2](h))+'%;';p.appendChild(q);
 var s=document.createElement('div');s.className='text-muted';s.style.fontSize='12px';s.textContent=t[3](h);[a,n,p,s].forEach(function(x){b.appendChild(x)});c.appendChild(b);g.appendChild(c)})}
function go(){fetch('/admin/panel-health.json').then(function(r){return r.json()}).then(draw).catch(function(){})}
draw({{ h|tojson }});setInterval(go,5000);
</script>
{% endblock %}
