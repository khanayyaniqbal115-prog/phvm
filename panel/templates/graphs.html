{% extends "base.html" %}
{% block title %}Graphs — {{ site_name }}{% endblock %}
{% block breadcrumb %}<span>PHvm</span> <span class="sep">›</span> <span class="current">Graphs</span>{% endblock %}
{% block content %}
<div class="page-header"><h1><i class="fas fa-chart-line"></i> {{ vm.name if vm else 'Server' }} — CPU &amp; memory</h1>
<p>Sampled every 5 minutes. <select id="hrs" class="form-control" style="display:inline-block;width:auto;" onchange="load()"><option value="6">6 hours</option><option value="24" selected>24 hours</option><option value="168">7 days</option></select></p></div>
<div class="card" style="max-width:900px;margin-bottom:16px;"><div class="card-header"><h2>CPU (%, 100 = one core)</h2></div><div class="card-body"><canvas id="cCpu" height="160" style="width:100%;"></canvas></div></div>
<div class="card" style="max-width:900px;"><div class="card-header"><h2>Memory (MB)</h2></div><div class="card-body"><canvas id="cMem" height="160" style="width:100%;"></canvas></div></div>
<script>
function draw(id, pts, idx, color) {
  const c = document.getElementById(id), w = c.width = c.clientWidth * 2, h = c.height = 320, x = c.getContext('2d');
  x.clearRect(0, 0, w, h); x.fillStyle = '#888'; x.font = '22px sans-serif';
  if (pts.length < 2) { x.fillText('Not enough data yet — check back in a few minutes.', 20, 60); return; }
  const vals = pts.map(p => p[idx]), max = Math.max(1, ...vals) * 1.1, t0 = pts[0][0], t1 = pts[pts.length - 1][0] || t0 + 1;
  x.strokeStyle = '#333'; for (let i = 0; i <= 4; i++) { const y = 20 + (h - 50) * i / 4; x.beginPath(); x.moveTo(60, y); x.lineTo(w - 10, y); x.stroke(); x.fillText(Math.round(max * (1 - i / 4)), 4, y + 6); }
  x.strokeStyle = color; x.lineWidth = 3; x.beginPath();
  pts.forEach((p, i) => { const px = 60 + (w - 70) * (p[0] - t0) / Math.max(1, t1 - t0), py = 20 + (h - 50) * (1 - p[idx] / max); i ? x.lineTo(px, py) : x.moveTo(px, py); }); x.stroke();
}
async function load() {
  const d = await (await fetch('/vm/{{ vm.vm_id if vm else "" }}/graph-data?hours=' + document.getElementById('hrs').value)).json();
  draw('cCpu', d.points || [], 1, '#58a6ff'); draw('cMem', d.points || [], 2, '#3fb950');
}
load();
</script>
{% endblock %}
