name: Build Phoenix (launcher exe + client mod + Android app)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  launcher:
    name: Launcher (.exe)
    needs: mod
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Phoenix-Launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps

      - name: Bundle the Phoenix Client mod jar into the installer
        uses: actions/download-artifact@v4
        with:
          name: phoenix-client-mod
          path: Phoenix-Launcher/bundled-mod

      - name: Auto-fix electron-builder.yml
        shell: pwsh
        run: |
          if (Test-Path electron-builder.yml) {
            (Get-Content electron-builder.yml) | Where-Object { $_ -notmatch 'files_exclude_placeholder' } | Set-Content electron-builder.yml
          }

      - name: Build Windows Launcher
        shell: pwsh
        env:
          SECRET_CSC_LINK: ${{ secrets.CSC_LINK }}
          SECRET_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if ($env:SECRET_CSC_LINK) {
            $env:CSC_LINK = $env:SECRET_CSC_LINK
            $env:CSC_KEY_PASSWORD = $env:SECRET_CSC_KEY_PASSWORD
          }
          npm run dist:win

      - name: Keep ONLY 1 Launcher EXE and Zip it
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path final-out | Out-Null
          $installer = Get-ChildItem -Path release -Filter "*Setup*.exe" -File | Select-Object -First 1
          if (-not $installer) {
            $installer = Get-ChildItem -Path release -Filter "*.exe" -File | Where-Object { $_.Name -notmatch 'unins|elevate' } | Select-Object -First 1
          }
          Copy-Item $installer.FullName -Destination "final-out/$($installer.Name)"
          Compress-Archive -Path $installer.FullName -DestinationPath "final-out/Phoenix-Launcher-Windows.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: Phoenix-Launcher-Windows
          path: Phoenix-Launcher/final-out/Phoenix-Launcher-Windows.zip

      - name: Attach to GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Phoenix-Launcher/final-out/*.exe
            Phoenix-Launcher/final-out/Phoenix-Launcher-Windows.zip

  mod:
    name: Phoenix Client (mod jar)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phoenix-client-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12
      - run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: phoenix-client-mod
          path: phoenix-client-mod/build/libs/phoenix-client-*[0-9].jar
      - name: Attach to GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: phoenix-client-mod/build/libs/phoenix-client-*[0-9].jar

  android:
    name: Android app (.apk)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Phoenix-Launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install --legacy-peer-deps
      - run: npm install --no-save --legacy-peer-deps @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
      - name: Build the web UI
        run: npx vite build
        env:
          # Optional: repository variable PHOENIX_API_BASE = URL of the hosted web version (for server status, etc.)
          VITE_API_BASE: ${{ vars.PHOENIX_API_BASE }}
      - name: Add Android platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
      - name: Set the app icon
        run: |
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            name=${d%%:*}; size=${d##*:}
            for f in ic_launcher ic_launcher_round ic_launcher_foreground; do
              convert public/icon-512.png -resize ${size}x${size} android/app/src/main/res/mipmap-$name/$f.png || true
            done
          done
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher*.xml || true
      - run: npx cap sync android
      - name: Build the APK
        working-directory: Phoenix-Launcher/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Keep Gradle reports when the build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-reports
          path: |
            Phoenix-Launcher/android/app/build/reports
            Phoenix-Launcher/android/build/reports
          if-no-files-found: ignore
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Phoenix-Launcher-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Phoenix-Launcher-Android
          path: Phoenix-Launcher/Phoenix-Launcher-Android.apk
      - name: Attach to GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Phoenix-Launcher/Phoenix-Launcher-Android.apk
