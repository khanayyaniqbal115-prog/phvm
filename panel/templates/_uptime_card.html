{% if vm.runtime == 'docker' %}
<div class="card" id="upCard" style="margin:20px 0;"><div class="card-header" style="display:flex;justify-content:space-between;align-items:center;"><h2 style="margin:0;"><i class="fas fa-heart-pulse"></i> Uptime &amp; incidents</h2><span style="display:flex;gap:12px;align-items:center;"><a class="btn btn-secondary btn-sm" href="/vm/{{ vm.vm_id }}/terminal?ssh=1"><i class="fas fa-terminal"></i> Open shell</a><b id="upPct" style="font-size:20px;">–</b></span></div><div class="card-body">
  <div id="upSug" style="display:none;border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:12px;"><i class="fas fa-arrow-trend-up"></i> <span id="upSugTxt"></span> <a class="btn btn-primary btn-sm" id="upSugBtn" href="#" style="margin-left:8px;">See plans</a></div>
  <div class="muted-note" style="margin:0 0 8px;" id="upNote">Loading…</div>
  <div id="upList" style="display:grid;gap:6px;font-size:13px;"></div>
</div></div>
<script>
(function () {
  var VMID = {{ vm.vm_id|tojson }}, $ = function (i) { return document.getElementById(i); };
  var L = {down: ['🔴', 'Went offline'], up: ['🟢', 'Back online'], overload: ['🟠', 'Hit its plan limit']};
  var W = {crash: 'crashed', oom: 'ran out of memory', stopped: 'stopped', cpu: 'CPU', ram: 'RAM'};
  fetch('/vm/' + VMID + '/uptime').then(function (r) { return r.json(); }).then(function (d) {
    if (!d.success) { $('upCard').style.display = 'none'; return; }
    $('upPct').textContent = d.pct + '%'; $('upNote').textContent = 'Uptime over the last ' + Math.min(30, Math.max(1, Math.round(d.days))) + ' day(s). Only crashes count as downtime — stopping the server yourself does not.';
    if (d.suggest) { $('upSug').style.display = 'block'; $('upSugTxt').textContent = d.suggest.text; $('upSugBtn').href = d.suggest.url; }
    var box = $('upList'); box.innerHTML = '';
    if (!d.events.length) box.innerHTML = '<div class="muted-note" style="margin:0;">No incidents. 🎉</div>';
    d.events.forEach(function (e) { var r = document.createElement('div'); var l = L[e.kind] || ['•', e.kind];
      r.textContent = l[0] + ' ' + l[1] + (e.note && W[e.note] ? ' — ' + W[e.note] : (e.note ? ' — ' + e.note : '')) + '  ·  ' + new Date(e.ts * 1000).toLocaleString(); box.appendChild(r); });
  }).catch(function () { $('upNote').textContent = 'Could not load.'; });
})();
</script>
{% endif %}
