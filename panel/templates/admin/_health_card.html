<div class="card" style="margin-bottom:18px;"><div class="card-body" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;" id="hcBox">
  <div><div class="muted-note" style="margin:0 0 4px;">CPU</div><b id="hcCpu">–</b></div>
  <div><div class="muted-note" style="margin:0 0 4px;">RAM</div><b id="hcRam">–</b></div>
  <div><div class="muted-note" style="margin:0 0 4px;">Disk</div><b id="hcDisk">–</b></div>
  <div><div class="muted-note" style="margin:0 0 4px;">Load</div><b id="hcLoad">–</b></div>
  <div><div class="muted-note" style="margin:0 0 4px;">Containers</div><b id="hcCt">–</b></div>
  <div><div class="muted-note" style="margin:0 0 4px;">Server uptime</div><b id="hcUp">–</b></div>
</div></div>
<script>
(function () {
  const g = id => document.getElementById(id), col = p => p > 90 ? 'var(--danger)' : p > 75 ? 'var(--warning)' : '';
  async function hc() {
    if (document.hidden) return;
    try { const d = await (await fetch('/admin/health.json')).json(); if (!d.success) return;
      g('hcCpu').textContent = d.cpu + '%'; g('hcCpu').style.color = col(d.cpu);
      g('hcRam').textContent = d.ram_pct + '% of ' + d.ram_gb + ' GB'; g('hcRam').style.color = col(d.ram_pct);
      g('hcDisk').textContent = d.disk_pct + '% (' + d.disk_free_gb + ' GB free)'; g('hcDisk').style.color = col(d.disk_pct);
      g('hcLoad').textContent = (d.load || []).join(' · ') || '–'; g('hcCt').textContent = d.containers == null ? '–' : d.containers;
      g('hcUp').textContent = d.uptime_h >= 48 ? Math.floor(d.uptime_h / 24) + ' days' : d.uptime_h + ' h'; } catch (e) {}
  }
  hc(); setInterval(hc, 15000);
})();
</script>
