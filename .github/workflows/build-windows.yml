name: Build Phoenix (launcher exe + client mod + Android app)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  launcher:
    name: Launcher (.exe)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Phoenix-Launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps
      - run: npm run dist:win
        env:
          # Optional code signing: add CSC_LINK and CSC_KEY_PASSWORD as repository secrets.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      - name: Zip the installer
        shell: pwsh
        run: Compress-Archive -Path release/Phoenix-Launcher-Setup-*.exe -DestinationPath release/Phoenix-Launcher-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Phoenix-Launcher-Windows
          path: |
            Phoenix-Launcher/release/*.exe
            Phoenix-Launcher/release/*.zip
      - name: Attach to GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Phoenix-Launcher/release/*.exe
            Phoenix-Launcher/release/*.zip

  mod:
    name: Phoenix Client (mod jar)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phoenix-client-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12
      - run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: phoenix-client-mod
          path: phoenix-client-mod/build/libs/phoenix-client-*[0-9].jar
      - name: Attach to GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: phoenix-client-mod/build/libs/phoenix-client-*[0-9].jar

  android:
    name: Android app (.apk)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Phoenix-Launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install --legacy-peer-deps
      - run: npm install --no-save --legacy-peer-deps @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
      - name: Build the web UI
        run: npx vite build
        env:
          # Optional: repository variable PHOENIX_API_BASE = URL of the hosted web version (for server status, etc.)
          VITE_API_BASE: ${{ vars.PHOENIX_API_BASE }}
      - run: npx cap add android
      - name: Set the app icon
        run: |
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            name=${d%%:*}; size=${d##*:}
            for f in ic_launcher ic_launcher_round ic_launcher_foreground; do
              convert public/icon-512.png -resize ${size}x${size} android/app/src/main/res/mipmap-$name/$f.png || true
            done
          done
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher*.xml || true
      - run: npx cap sync android
      - name: Build the APK
        working-directory: Phoenix-Launcher/android
        run: ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Phoenix-Launcher-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Phoenix-Launcher-Android
          path: Phoenix-Launcher/Phoenix-Launcher-Android.apk
      - name: Attach to GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Phoenix-Launcher/Phoenix-Launcher-Android.apk
