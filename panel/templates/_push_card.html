<div class="card" style="margin:20px 0;"><div class="card-header"><h2 style="margin:0;"><i class="fas fa-bell"></i> Phone &amp; desktop alerts</h2></div><div class="card-body">
  <div class="muted-note" style="margin:0 0 12px;">Get a pop-up on this device when a server crashes, comes back, expires soon or hits its limit — even when the panel is closed. Works over <b>https</b>. On iPhone, add the panel to your Home Screen first.</div>
  <div class="st-row" style="display:flex;gap:8px;flex-wrap:wrap;"><button class="btn btn-primary" type="button" id="pushBtn">Checking…</button><button class="btn btn-secondary" type="button" id="pushTest" style="display:none;">Send test</button></div>
  <div class="muted-note" id="pushMsg" style="margin:10px 0 0;"></div>
</div></div>
<script>
(function () {
  var b = document.getElementById('pushBtn'), t = document.getElementById('pushTest'), m = document.getElementById('pushMsg');
  async function refresh() {
    if (!window.phvmPush) { b.textContent = 'Loading…'; return; }
    var s = await window.phvmPush.state();
    t.style.display = s === 'on' ? '' : 'none';
    if (s === 'unsupported') { b.textContent = 'Not supported here'; b.disabled = true; m.textContent = 'This browser cannot show push alerts (or the page is not on https).'; }
    else if (s === 'denied') { b.textContent = 'Blocked'; b.disabled = true; m.textContent = 'Notifications are blocked for this site — allow them in the browser settings.'; }
    else { b.disabled = false; b.textContent = s === 'on' ? 'Turn off alerts on this device' : 'Turn on alerts on this device'; b.dataset.s = s; }
  }
  b.onclick = async function () { b.disabled = true; try { m.textContent = await (b.dataset.s === 'on' ? window.phvmPush.disable() : window.phvmPush.enable()); } catch (e) { m.textContent = e.message || 'Failed'; } refresh(); };
  t.onclick = async function () { var r = await (await fetch('/push/test', {method: 'POST', headers: {'Content-Type': 'application/json', 'X-CSRF-Token': window.PHVM_CSRF || ''}, body: '{}'})).json(); m.textContent = r.message; };
  if (window.phvmPush) refresh(); else window.addEventListener('load', refresh);
})();
</script>
