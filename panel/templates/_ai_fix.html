{% if ai_enabled() %}
<button type="button" id="aifBtn" title="Ask the AI what is wrong" style="position:fixed;right:80px;bottom:22px;z-index:9997;border:1px solid var(--border);border-radius:999px;background:#17171b;color:inherit;padding:10px 16px;font-weight:600;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.45);"><i class="fas fa-wand-magic-sparkles"></i> Fix it (AI)</button>
<div id="aifBox" style="display:none;position:fixed;right:18px;bottom:76px;width:min(420px,calc(100vw - 36px));z-index:9999;background:#101013;border:1px solid var(--border);border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.6);padding:16px;">
  <div style="display:flex;justify-content:space-between;font-weight:700;margin-bottom:8px;"><span><i class="fas fa-wand-magic-sparkles"></i> AI troubleshooter</span><button type="button" id="aifX" style="background:none;border:0;color:inherit;font-size:18px;cursor:pointer;" aria-label="Close">&times;</button></div>
  <div id="aifTxt" style="font-size:13.5px;line-height:1.5;white-space:pre-wrap;max-height:42vh;overflow:auto;"></div>
  <div id="aifAct" style="display:none;margin-top:12px;"><button type="button" class="btn btn-primary btn-sm" id="aifRestart"><i class="fas fa-rotate"></i> Restart now</button></div>
</div>
<script>
(function () {
  var VMID = {{ vm.vm_id|tojson }}, KIND = {{ (vm.provision_kind or '')|tojson }}, TOK = {{ csrf_token|tojson }};
  var H = {'Content-Type': 'application/json', 'X-CSRF-Token': TOK}, $ = function (i) { return document.getElementById(i); };
  var pw = KIND === 'web' ? '/web/power' : (KIND === 'minecraft' || KIND === 'bot') ? '/server/power' : '';
  $('aifX').onclick = function () { $('aifBox').style.display = 'none'; };
  $('aifBtn').onclick = async function () {
    $('aifBox').style.display = 'block'; $('aifAct').style.display = 'none'; $('aifTxt').textContent = 'Reading the logs…';
    try {
      var r = await (await fetch('/vm/' + VMID + '/ai/diagnose', {method: 'POST', headers: H, body: JSON.stringify({lang: document.documentElement.lang || navigator.language || ''})})).json();
      $('aifTxt').textContent = r.success ? r.diagnosis : (r.message || 'Error');
      if (r.success && r.suggest_restart && pw) $('aifAct').style.display = 'block';
    } catch (e) { $('aifTxt').textContent = 'Cannot reach the panel.'; }
  };
  $('aifRestart').onclick = async function () {
    $('aifRestart').disabled = true;
    try { var r = await (await fetch('/vm/' + VMID + pw, {method: 'POST', headers: H, body: JSON.stringify({action: 'restart'})})).json(); $('aifTxt').textContent += '\n\n' + (r.success ? '✔ Restarting…' : (r.message || 'Failed')); } catch (e) {}
    $('aifRestart').disabled = false;
  };
})();
</script>
{% endif %}
