{# Reusable file manager. Include once per page, then call fmInit(vmId, csrfToken, startPath). #}
<style>
.fm-card { overflow: hidden; }
.fm-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--bg-secondary); }
.fm-bar.sel { background: var(--accent-dim, rgba(95,109,245,.12)); }
.fm-path { font-family: var(--font-mono); font-size: 12.5px; color: var(--text-secondary); flex: 1; min-width: 160px; overflow-x: auto; white-space: nowrap; padding: 4px 2px; }
.fm-path a { color: var(--accent); text-decoration: none; padding: 0 2px; }
.fm-path a:hover { text-decoration: underline; }
.fm-bar .btn { white-space: nowrap; }
.fm-selcount { font-size: 13px; font-weight: 600; margin-right: 6px; }
.fm-table { width: 100%; border-collapse: collapse; }
.fm-table th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-muted); padding: 10px 14px; border-bottom: 1px solid var(--border); font-weight: 600; }
.fm-table td { padding: 9px 14px; border-bottom: 1px solid var(--border); font-size: 13.5px; vertical-align: middle; }
.fm-table tr:last-child td { border-bottom: none; }
.fm-table tbody tr:hover { background: var(--bg-secondary); }
.fm-table tbody tr.picked { background: var(--accent-dim, rgba(95,109,245,.12)); }
.fm-cb { width: 16px; height: 16px; cursor: pointer; accent-color: var(--accent); }
.fm-name { cursor: pointer; display: flex; align-items: center; gap: 10px; min-width: 0; font-weight: 500; }
.fm-name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fm-name:hover span { color: var(--accent); }
.fm-ic { width: 18px; text-align: center; color: var(--text-muted); flex-shrink: 0; }
.fm-ic.dir { color: #f2b04c; }
.fm-ic.arc { color: #a78bfa; }
.fm-muted { color: var(--text-muted); font-size: 12.5px; white-space: nowrap; }
.fm-acts { display: flex; gap: 2px; justify-content: flex-end; }
.fm-acts button { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 6px 8px; border-radius: 6px; font-size: 13px; }
.fm-acts button:hover { background: var(--bg-card); color: var(--text-primary); }
.fm-acts button.danger:hover { color: var(--danger); }
.fm-empty { padding: 48px 20px; text-align: center; color: var(--text-muted); font-size: 14px; }
.fm-drop.dragover { outline: 2px dashed var(--accent); outline-offset: -6px; }
.fm-prog { display: none; padding: 10px 16px; border-bottom: 1px solid var(--border); font-size: 12.5px; color: var(--text-secondary); }
.fm-prog .track { height: 6px; background: var(--bg-secondary); border-radius: 99px; overflow: hidden; margin-top: 6px; }
.fm-prog .track i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
.fm-toast { position: fixed; right: 20px; bottom: 20px; z-index: 1100; max-width: 380px; padding: 12px 16px; border-radius: 10px; font-size: 13.5px; background: var(--bg-card); border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,.4); display: none; }
.fm-toast.ok { border-color: rgba(61,220,151,.5); } .fm-toast.err { border-color: rgba(255,107,107,.6); }
#fmEditor { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.65); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
#fmEditor .box { width: 100%; max-width: 980px; max-height: 90vh; display: flex; flex-direction: column; background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
#fmEditor .box header, #fmEditor .box footer { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
#fmEditor .box footer { border-bottom: none; border-top: 1px solid var(--border); justify-content: flex-end; }
#fmEditor textarea { flex: 1; min-height: 55vh; width: 100%; resize: none; border: none; outline: none; padding: 14px 16px; font-family: var(--font-mono); font-size: 13px; line-height: 1.55; background: var(--bg-primary, #0b0e14); color: var(--text-primary); }
@media (max-width: 700px) { .fm-col-mod, .fm-col-size { display: none; } .fm-table td, .fm-table th { padding: 9px 10px; } }
</style>

<div class="card fm-card fm-drop" id="fmDrop">
  <div class="fm-bar">
    <button class="btn btn-sm btn-secondary" id="fmUp" title="Up one folder"><i class="fas fa-arrow-up"></i></button>
    <div class="fm-path" id="fmPath">/</div>
    <button class="btn btn-sm btn-secondary" id="fmRefresh" title="Refresh"><i class="fas fa-rotate"></i></button>
  </div>
  <div class="fm-bar" id="fmActions">
    <button class="btn btn-sm btn-primary" id="fmUploadBtn"><i class="fas fa-upload"></i> Upload</button>
    <button class="btn btn-sm btn-secondary" id="fmNewFolder"><i class="fas fa-folder-plus"></i> New folder</button>
    <button class="btn btn-sm btn-secondary" id="fmNewFile"><i class="fas fa-file-circle-plus"></i> New file</button>
    <input type="file" id="fmFileInput" multiple style="display:none;">
    <span class="fm-muted" style="margin-left:auto;">Drag &amp; drop to upload · tick files to Zip, Extract or Delete · use the row icons to Rename, Zip, Extract</span>
  </div>
  <div class="fm-bar sel" id="fmSelBar" style="display:none;">
    <span class="fm-selcount" id="fmSelCount">0 selected</span>
    <button class="btn btn-sm btn-secondary" id="fmZipSel"><i class="fas fa-file-zipper"></i> Zip</button>
    <button class="btn btn-sm btn-secondary" id="fmExtractSel" style="display:none;"><i class="fas fa-box-open"></i> Extract here</button>
    <button class="btn btn-sm btn-danger" id="fmDeleteSel"><i class="fas fa-trash"></i> Delete</button>
    <button class="btn btn-sm btn-secondary" id="fmClearSel" style="margin-left:auto;">Clear</button>
  </div>
  <div class="fm-prog" id="fmProg"><span id="fmProgText">Uploading…</span><div class="track"><i id="fmProgBar"></i></div></div>
  <div style="overflow-x:auto;">
    <table class="fm-table">
      <thead><tr>
        <th style="width:40px;"><input type="checkbox" class="fm-cb" id="fmAll" title="Select all"></th>
        <th>Name</th><th class="fm-col-size" style="width:100px;">Size</th><th class="fm-col-mod" style="width:170px;">Modified</th><th style="width:190px;"></th>
      </tr></thead>
      <tbody id="fmBody"></tbody>
    </table>
    <div class="fm-empty" id="fmEmpty" style="display:none;"><i class="fas fa-folder-open" style="font-size:28px;display:block;margin-bottom:10px;opacity:.5;"></i>This folder is empty. Upload files or drop them here.</div>
  </div>
</div>

<div id="fmEditor">
  <div class="box">
    <header><b class="mono" id="fmEditorTitle" style="font-size:13px;overflow:hidden;text-overflow:ellipsis;"></b>
      <button class="btn btn-sm btn-secondary" id="fmEditorClose">Close</button></header>
    <textarea id="fmEditorText" spellcheck="false"></textarea>
    <footer><span class="fm-muted" id="fmEditorMsg" style="margin-right:auto;"></span>
      <button class="btn btn-secondary" id="fmEditorCancel">Cancel</button>
      <button class="btn btn-primary" id="fmEditorSave"><i class="fas fa-save"></i> Save</button></footer>
  </div>
</div>
<div class="fm-toast" id="fmToast"></div>

<script>
(function () {
  let VM_ID = '', CSRF = '', cwd = '/', started = false, editing = null, entries = [];
  const $ = id => document.getElementById(id);
  const TEXTY = /(\.(txt|md|conf|cfg|ini|json5?|ya?ml|log|sh|py|js|mjs|ts|html|css|xml|service|env|toml|properties|mcmeta|lang|csv|bat|sk|yml)$|^(\.env|\.gitignore|Dockerfile|Procfile)$)/i;
  const ARCH = /\.(zip|tar|tar\.gz|tgz|tar\.bz2|tbz2|tar\.xz|txz)$/i;
  const jh = () => ({ 'Content-Type': 'application/json', 'X-CSRF-Token': CSRF });
  const join = (d, n) => (d === '/' ? '' : d) + '/' + n;
  const fmtSize = b => { if (!b) return '—'; const u = ['B','KB','MB','GB','TB']; let i = 0, n = b; while (n >= 1024 && i < 4) { n /= 1024; i++; } return (i ? n.toFixed(1) : n) + ' ' + u[i]; };
  const fmtTime = t => t ? new Date(t * 1000).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }) : '—';

  let toastT;
  function toast(msg, ok) {
    const t = $('fmToast'); t.textContent = msg; t.className = 'fm-toast ' + (ok ? 'ok' : 'err'); t.style.display = 'block';
    clearTimeout(toastT); toastT = setTimeout(() => t.style.display = 'none', ok ? 3000 : 6000);
  }
  async function api(path, body) {
    try {
      const r = await fetch(`/vm/${VM_ID}/files/${path}`, { method: 'POST', headers: jh(), body: JSON.stringify(body) });
      return await r.json();
    } catch (e) { return { success: false, message: String(e) }; }
  }
  function btn(act, icon, title, cls) {
    const b = document.createElement('button'); b.dataset.act = act; b.title = title; if (cls) b.className = cls;
    b.innerHTML = `<i class="fas ${icon}"></i>`; return b;
  }
  function crumbs() {
    const el = $('fmPath'); el.textContent = '';
    const add = (label, p) => { const a = document.createElement('a'); a.href = '#'; a.textContent = label; a.onclick = e => { e.preventDefault(); load(p); }; el.appendChild(a); };
    add('/', '/'); let acc = '';
    cwd.split('/').filter(Boolean).forEach(part => { acc += '/' + part; el.appendChild(document.createTextNode(' / ')); add(part, acc); });
  }
  function selected() { return [...document.querySelectorAll('.fm-cb[data-n]:checked')].map(c => c.dataset.n); }
  function syncSel() {
    const names = selected(), n = names.length;
    $('fmSelBar').style.display = n ? '' : 'none'; $('fmActions').style.display = n ? 'none' : '';
    $('fmSelCount').textContent = n + ' selected';
    const one = n === 1 ? entries.find(e => e.name === names[0]) : null;
    $('fmExtractSel').style.display = (one && !one.is_dir && ARCH.test(one.name)) ? '' : 'none';
    document.querySelectorAll('#fmBody tr').forEach(tr => { const c = tr.querySelector('.fm-cb'); tr.classList.toggle('picked', !!(c && c.checked)); });
    const all = document.querySelectorAll('.fm-cb[data-n]');
    $('fmAll').checked = all.length > 0 && n === all.length;
  }
  function row(e) {
    const full = join(cwd, e.name), isArc = !e.is_dir && ARCH.test(e.name), isTxt = !e.is_dir && TEXTY.test(e.name);
    const tr = document.createElement('tr');
    const td1 = document.createElement('td'); const cb = document.createElement('input');
    cb.type = 'checkbox'; cb.className = 'fm-cb'; cb.dataset.n = e.name; cb.onchange = syncSel; td1.appendChild(cb);
    const td2 = document.createElement('td'); const nm = document.createElement('div'); nm.className = 'fm-name';
    const ic = document.createElement('i'); ic.className = 'fas fm-ic ' + (e.is_dir ? 'fa-folder dir' : isArc ? 'fa-file-zipper arc' : isTxt ? 'fa-file-lines' : 'fa-file');
    const sp = document.createElement('span'); sp.textContent = e.name; nm.append(ic, sp); td2.appendChild(nm);
    nm.onclick = () => { if (e.is_dir) load(full); else if (isTxt) openEditor(full); };
    const td3 = document.createElement('td'); td3.className = 'fm-muted fm-col-size'; td3.textContent = e.is_dir ? '—' : fmtSize(e.size);
    const td4 = document.createElement('td'); td4.className = 'fm-muted fm-col-mod'; td4.textContent = fmtTime(e.mtime);
    const td5 = document.createElement('td'); const ac = document.createElement('div'); ac.className = 'fm-acts';
    if (isArc) { ac.append(btn('ext', 'fa-box-open', 'Extract here'), btn('extf', 'fa-folder-tree', 'Extract to a new folder')); }
    if (!e.is_dir) ac.append(btn('dl', 'fa-download', 'Download'));
    if (isTxt) ac.append(btn('edit', 'fa-pen', 'Edit'));
    ac.append(btn('zip', 'fa-file-zipper', 'Zip'), btn('ren', 'fa-i-cursor', 'Rename'), btn('del', 'fa-trash', 'Delete', 'danger'));
    td5.appendChild(ac);
    ac.onclick = async ev => {
      const b = ev.target.closest('button'); if (!b) return; const a = b.dataset.act;
      if (a === 'dl') location = `/vm/${VM_ID}/files/download?path=${encodeURIComponent(full)}`;
      else if (a === 'edit') openEditor(full);
      else if (a === 'ren') rename(e.name);
      else if (a === 'del') del([e.name]);
      else if (a === 'zip') zip([e.name]);
      else if (a === 'ext') extract(full, false);
      else if (a === 'extf') extract(full, true);
    };
    tr.append(td1, td2, td3, td4, td5); return tr;
  }
  async function load(path) {
    const body = $('fmBody'); body.innerHTML = '<tr><td colspan="5" class="fm-empty">Loading…</td></tr>';
    try {
      const r = await fetch(`/vm/${VM_ID}/files/list?path=${encodeURIComponent(path)}`); const d = await r.json();
      if (!d.success) { body.innerHTML = ''; const td = document.createElement('td'); td.colSpan = 5; td.className = 'fm-empty'; td.style.color = 'var(--danger)'; td.textContent = d.message || 'Could not load'; const tr = document.createElement('tr'); tr.appendChild(td); body.appendChild(tr); return; }
      cwd = d.path; entries = d.entries; crumbs(); body.innerHTML = '';
      $('fmEmpty').style.display = entries.length ? 'none' : '';
      entries.forEach(e => body.appendChild(row(e))); syncSel();
    } catch (e) { body.innerHTML = ''; toast(String(e), false); }
  }
  async function rename(old) {
    const nn = prompt('Rename to:', old); if (!nn || nn === old) return;
    const d = await api('rename', { path: join(cwd, old), new_name: nn }); if (!d.success) toast(d.message || 'Rename failed', false); load(cwd);
  }
  async function del(names) {
    if (!confirm(names.length === 1 ? `Delete "${names[0]}"? This cannot be undone.` : `Delete ${names.length} items? This cannot be undone.`)) return;
    const d = await api('delete', { paths: names.map(n => join(cwd, n)) });
    toast(d.success ? 'Deleted' : (d.message || 'Delete failed'), !!d.success); load(cwd);
  }
  async function zip(names) {
    const def = names.length === 1 ? names[0] : 'archive';
    const out = prompt('Name of the zip file:', def); if (out === null) return;
    toast('Creating zip…', true);
    const d = await api('zip', { path: cwd, names, out }); toast(d.message || (d.success ? 'Zip created' : 'Zip failed'), !!d.success); load(cwd);
  }
  async function extract(full, toFolder) {
    toast('Extracting…', true);
    const d = await api('extract', { path: full, to_folder: toFolder }); toast(d.message || (d.success ? 'Extracted' : 'Extract failed'), !!d.success); load(cwd);
  }
  function upload(files) {
    files = [...files]; if (!files.length) return;
    const fd = new FormData(); files.forEach(f => fd.append('file', f)); fd.append('path', cwd); fd.append('_csrf', CSRF);
    const x = new XMLHttpRequest(); x.open('POST', `/vm/${VM_ID}/files/upload`); x.setRequestHeader('X-CSRF-Token', CSRF);
    const prog = $('fmProg'), bar = $('fmProgBar'), txt = $('fmProgText'); prog.style.display = 'block'; bar.style.width = '0';
    const label = files.length === 1 ? files[0].name : files.length + ' files';
    x.upload.onprogress = e => { if (e.lengthComputable) { const p = Math.round(e.loaded / e.total * 100); bar.style.width = p + '%'; txt.textContent = `Uploading ${label} — ${p}% (${fmtSize(e.loaded)} / ${fmtSize(e.total)})`; } };
    x.onload = () => { prog.style.display = 'none'; let d = {}; try { d = JSON.parse(x.responseText); } catch (e) {} toast(d.message || (x.status < 300 ? 'Uploaded' : 'Upload failed (' + x.status + ')'), x.status < 300 && d.success !== false); load(cwd); };
    x.onerror = () => { prog.style.display = 'none'; toast('Upload failed (network error)', false); };
    x.send(fd);
  }
  async function openEditor(path) {
    editing = path; $('fmEditorTitle').textContent = path; $('fmEditorText').value = 'Loading…'; $('fmEditorMsg').textContent = ''; $('fmEditor').style.display = 'flex';
    const d = await api('read', { path });
    if (!d.success) { $('fmEditorText').value = ''; $('fmEditorMsg').textContent = d.message || 'Could not read file'; return; }
    $('fmEditorText').value = d.content;
  }
  function closeEditor() { $('fmEditor').style.display = 'none'; editing = null; }
  async function saveEditor() {
    if (!editing) return; $('fmEditorMsg').textContent = 'Saving…';
    const d = await api('write', { path: editing, content: $('fmEditorText').value });
    $('fmEditorMsg').textContent = d.success ? 'Saved.' : (d.message || 'Save failed'); if (d.success) load(cwd);
  }

  function bind() {
    $('fmUp').onclick = () => { if (cwd !== '/') load(cwd.split('/').slice(0, -1).join('/') || '/'); };
    $('fmRefresh').onclick = () => load(cwd);
    $('fmUploadBtn').onclick = () => $('fmFileInput').click();
    $('fmFileInput').onchange = e => { upload(e.target.files); e.target.value = ''; };
    $('fmNewFolder').onclick = async () => {
      const n = prompt('New folder name:'); if (!n) return;
      const d = await api('mkdir', { path: cwd, name: n }); if (!d.success) toast(d.message || 'Could not create folder', false); load(cwd);
    };
    $('fmNewFile').onclick = async () => {
      const n = prompt('New file name (e.g. config.yml):'); if (!n || n.includes('/')) return;
      const d = await api('write', { path: join(cwd, n), content: '' }); if (!d.success) toast(d.message || 'Could not create file', false); else openEditor(join(cwd, n)); load(cwd);
    };
    $('fmAll').onchange = e => { document.querySelectorAll('.fm-cb[data-n]').forEach(c => c.checked = e.target.checked); syncSel(); };
    $('fmClearSel').onclick = () => { document.querySelectorAll('.fm-cb').forEach(c => c.checked = false); syncSel(); };
    $('fmZipSel').onclick = () => zip(selected());
    $('fmDeleteSel').onclick = () => del(selected());
    $('fmExtractSel').onclick = () => { const n = selected()[0]; if (n) extract(join(cwd, n), false); };
    $('fmEditorClose').onclick = $('fmEditorCancel').onclick = closeEditor;
    $('fmEditorSave').onclick = saveEditor;
    $('fmEditorText').addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); saveEditor(); } });
    const dz = $('fmDrop');
    ['dragenter', 'dragover'].forEach(t => dz.addEventListener(t, e => { e.preventDefault(); dz.classList.add('dragover'); }));
    ['dragleave', 'drop'].forEach(t => dz.addEventListener(t, e => { e.preventDefault(); dz.classList.remove('dragover'); }));
    dz.addEventListener('drop', e => { if (e.dataTransfer.files && e.dataTransfer.files.length) upload(e.dataTransfer.files); });
  }
  window.fmInit = function (vmId, csrf, startPath) {
    VM_ID = vmId; CSRF = csrf || ''; if (!started) { started = true; bind(); }
    load(startPath || cwd || '/');
  };
})();
</script>
