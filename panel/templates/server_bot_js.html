<script>
const el = id => document.getElementById(id);
async function botGet(p) { return (await fetch(`/vm/${VM}/server/bot/${p}`)).json(); }
async function botPost(p, body) { return (await fetch(`/vm/${VM}/server/bot/${p}`, {method: 'POST', headers: H, body: JSON.stringify(body || {})})).json(); }
let loaded = {};
function showTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  document.querySelectorAll('.pane').forEach(p => p.classList.toggle('active', p.id === 'pane-' + name));
  if (name === 'files' && !loaded.files) { loaded.files = true; filesOpen(); }
  if (name === 'setup' && !loaded.setup) { loaded.setup = true; setupInit(); alInit(); }
}
async function setupInit() {
  const d = await botGet('setup');
  if (!d.success) { alert(d.message); loaded.setup = false; return; }
  el('envText').value = d.env || '';
  const [u, b] = (d.git || '').split('|'); if (u) el('gitUrl').value = u; if (b) el('gitBranch').value = b;
}
async function envSave() { const d = await botPost('setup', {env: el('envText').value}); alert(d.message); }
async function depsInstall() { const d = await botPost('install-deps'); alert(d.message); if (d.success) showTab('console'); }
async function gitDeploy() {
  const url = el('gitUrl').value.trim(); if (!url) return;
  if (!confirm('Download this repository into /root/bot? Files with the same name are overwritten.')) return;
  const d = await botPost('git-deploy', {url, branch: el('gitBranch').value.trim()}); alert(d.message); if (d.success) showTab('console');
}
async function alInit() {
  if (!el('alState')) return; const d = await (await fetch(`/vm/${VM}/server/alerts`)).json();
  if (d.success) el('alState').textContent = d.enabled ? 'On (' + d.masked + ')' : 'Off';
}
async function alSave() {
  const d = await (await fetch(`/vm/${VM}/server/alerts`, {method: 'POST', headers: H, body: JSON.stringify({webhook: el('alHook').value.trim()})})).json();
  alert(d.message); if (d.success) { el('alHook').value = ''; alInit(); }
}
async function alTest() { const d = await (await fetch(`/vm/${VM}/server/alerts`, {method: 'POST', headers: H, body: JSON.stringify({test: true})})).json(); alert(d.message); }
</script>
