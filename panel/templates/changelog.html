<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>What's new</title>
<style>body{margin:0;background:#0b0b0d;color:#e6e6ea;font-family:Inter,system-ui,sans-serif}.w{max-width:760px;margin:0 auto;padding:32px 16px}h1{margin:0 0 4px}.s{color:#a5a5b0;margin:0 0 24px}
.c{background:#141418;border:1px solid #26262c;border-radius:16px;padding:18px 22px;margin-bottom:14px}.c h2{margin:0 0 8px;font-size:17px}ul{margin:0;padding-left:18px;color:#c9c9d2;line-height:1.55;font-size:14px}a{color:#cfcfd8}</style></head>
<body><div class="w"><h1>What's new</h1><p class="s">Current version {{ version }} · <a href="/">Back to panel</a></p>
{% for i in items %}<div class="c"><h2>{{ i.v }}</h2><ul>{% for l in i.lines[:12] %}<li>{{ l }}</li>{% endfor %}</ul></div>{% else %}<p>No notes yet.</p>{% endfor %}</div></body></html>
