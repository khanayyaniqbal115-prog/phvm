{% if vm.runtime == 'docker' %}
<div class="card" id="hsCard" style="margin:20px 0;"><div class="card-header" style="display:flex;justify-content:space-between;align-items:center;"><h2 style="margin:0;"><i class="fas fa-shield-heart"></i> Health score</h2><b id="hsNum" style="font-size:22px;">–</b></div><div class="card-body">
  <div style="height:8px;border-radius:6px;background:var(--border);overflow:hidden;margin-bottom:12px;"><div id="hsBar" style="height:100%;width:0;background:var(--accent);transition:width .5s;"></div></div>
  <div id="hsList" style="display:grid;gap:6px;font-size:13px;">Loading…</div>
</div></div>
<script>
(function(){var l=document.getElementById('hsList');
fetch('/vm/{{ vm.vm_id }}/health').then(function(r){return r.json()}).then(function(j){
 if(!j.success){l.textContent=j.message||'Not available';return}
 document.getElementById('hsNum').textContent=j.score+'/100';document.getElementById('hsBar').style.width=j.score+'%';
 l.innerHTML='';j.items.forEach(function(i){var d=document.createElement('div');d.textContent=(i.ok?'✅ ':'⚠️ ')+i.text;l.appendChild(d)});
}).catch(function(){l.textContent='Could not load.'})})();
</script>
{% endif %}
