appId: com.phoenixlauncher.desktop
productName: Phoenix Launcher
copyright: Phoenix Launcher
directories:
  output: release
files:
  - dist/**/*
  - electron/**/*
  - package.json
  - phoenix.ico
asar: true
win:
  icon: phoenix.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
